# Maps OpenAPI operations to CLI resource groups and commands.
# The generator reads this + openapi-spec.yaml to produce cmd/generated/*.go
#
# Each resource becomes a Cobra command group (e.g., "supermetrics login-links").
# Each command within becomes a subcommand (e.g., "supermetrics login-links create").
#
# server_index: which server from the spec's servers[] to use (0-indexed).
#
# WARNING: server_index is a POSITIONAL index into the spec's servers[]. If a
# spec sync reorders servers[], these indices silently point at the wrong server
# (wrong host and/or missing version prefix) with no error — the generated URLs
# just become wrong. Re-verify every server_index below against the synced
# spec's servers[] whenever openapi-spec.yaml changes. (A durable fix would
# resolve the server per operation from per-path `servers` overrides instead.)
#
#   0 = https://api.supermetrics.com/v2 (Data API)
#   1 = https://api.supermetrics.com (Datasource search)
#   2 = https://api.supermetrics.com/v2 (Management API)
#   3 = https://api.supermetrics.com (Connector Builder API — its paths carry /v1)
#   4 = https://dts-api.supermetrics.com/v1 (DWH Backfills API)

resources:
  login-links:
    description: "Manage OAuth login links for data source authentication"
    server_index: 2
    commands:
      create:
        operation_id: createLoginLink
        description: "Create a new login link for OAuth authentication"
        dry_run: true
        spinner_text: "Creating login link..."
      get:
        operation_id: getLoginLink
        description: "Get a login link by ID"
        spinner_text: "Fetching login link..."
      list:
        operation_id: listLoginLinks
        description: "List all login links"
        spinner_text: "Fetching login links..."
      close:
        operation_id: closeLoginLink
        description: "Close (deactivate) a login link"
        confirm: "Close login link?"
        spinner_text: "Closing login link..."

  logins:
    description: "View authenticated data source logins"
    server_index: 2
    commands:
      get:
        operation_id: getDataSourceLogin
        description: "Get a login by ID"
        spinner_text: "Fetching login..."
      list:
        operation_id: listDataSourceLogins
        description: "List all data source logins"
        spinner_text: "Fetching logins..."

  accounts:
    description: "List available accounts for a data source"
    server_index: 0
    commands:
      list:
        operation_id: getAccounts
        description: "List accounts for a data source login"
        timeout: 60m
        spinner_text: "Fetching accounts..."

  queries:
    description: "Execute data queries against connected data sources"
    server_index: 0
    commands:
      execute:
        operation_id: getData
        description: "Execute a data query"
        timeout: 60m
        spinner_text: "Fetching data..."
        async: true
        paginated: true
        exclude_params:
          - sync_timeout

  backfills:
    description: "Manage Data Warehouse backfills"
    server_index: 4
    commands:
      create:
        operation_id: createBackfill
        description: "Create a new backfill for a transfer"
        dry_run: true
        spinner_text: "Creating backfill..."
        wait: true
        timeout: "60m"
      get:
        operation_id: getBackfillById
        description: "Get a backfill by ID"
        spinner_text: "Fetching backfill..."
      get-latest:
        operation_id: getLatestBackfill
        description: "Get the latest backfill for a transfer"
        spinner_text: "Fetching backfill..."
      list-incomplete:
        operation_id: listIncompleteBackfills
        description: "List all incomplete backfills for a team"
        spinner_text: "Fetching backfills..."
      cancel:
        operation_id: updateBackfillStatus
        description: "Cancel a backfill"
        confirm: "Cancel backfill {backfill_id}?"
        dry_run: true
        spinner_text: "Cancelling backfill..."
        fixed_values:
          status: "CANCELLED"

  datasource:
    description: "View data source configuration details"
    server_index: 1
    commands:
      get:
        operation_id: getDatasourceDetails
        description: "Get datasource configuration details"
        spinner_text: "Fetching data source details..."

  connector-builder:
    description: "Manage Connector Builder connectors"
    server_index: 3
    commands:
      list:
        operation_id: listConnectors
        description: "List all connectors"
        spinner_text: "Fetching connectors..."
      get:
        operation_id: getConnector
        description: "Get connector details"
        spinner_text: "Fetching connector..."
      create:
        operation_id: createConnector
        description: "Create a new connector"
        dry_run: true
        spinner_text: "Creating connector..."
      update:
        operation_id: updateConnector
        description: "Update a connector"
        dry_run: true
        no_content: true
        done_message: "Connector updated."
        spinner_text: "Updating connector..."
      delete:
        operation_id: deleteConnector
        description: "Delete a connector"
        no_content: true
        done_message: "Connector deleted."
        confirm: "Delete connector {connector_identifier}?"
        spinner_text: "Deleting connector..."

  connector-builder-secrets:
    description: "Manage secrets for Connector Builder connectors"
    server_index: 3
    commands:
      list:
        operation_id: listConnectorSecrets
        description: "List secrets for a connector"
        spinner_text: "Fetching secrets..."
      create:
        operation_id: createConnectorSecret
        description: "Create a new secret"
        secure_input:
          - secret_value
        spinner_text: "Creating secret..."
      update:
        operation_id: updateConnectorSecret
        description: "Update a secret value"
        no_content: true
        done_message: "Secret updated."
        secure_input:
          - secret_value
        spinner_text: "Updating secret..."
      delete:
        operation_id: deleteConnectorSecret
        description: "Delete a secret"
        no_content: true
        done_message: "Secret deleted."
        confirm: "Delete secret {secret_placeholder}?"
        spinner_text: "Deleting secret..."

  connector-builder-logs:
    description: "View Connector Builder execution logs"
    server_index: 3
    commands:
      list:
        operation_id: listConnectorLogs
        description: "List execution logs for a connector"
        spinner_text: "Fetching logs..."
      get:
        operation_id: getConnectorLog
        description: "Get log entry details"
        spinner_text: "Fetching log details..."

  connector-builder-logo:
    description: "Manage Connector Builder connector logos"
    server_index: 3
    commands:
      get:
        operation_id: getConnectorLogo
        description: "Get the logo URL for a connector"
        spinner_text: "Fetching logo..."
      upload:
        operation_id: uploadConnectorLogo
        description: "Upload a logo for a connector"
        spinner_text: "Uploading logo..."

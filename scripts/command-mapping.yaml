        spinner_text: "Creating data source connection..."

  teams:
    description: "Manage teams and team settings"
    commands:
      get:
        operation_id: getTeam
        description: "Get team details"
        spinner_text: "Fetching team..."
      update:
        operation_id: updateTeam
        description: "Update team properties"
        spinner_text: "Updating team..."
      settings-get:
        operation_id: getTeamSettings

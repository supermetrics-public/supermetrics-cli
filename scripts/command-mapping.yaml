    commands:
      list:
        operation_id: listTeamLicenses
        description: "List licenses for a team"
        spinner_text: "Fetching licenses..."
      assign:
        operation_id: assignTeamLicenseUsers
        description: "Assign users to a license"
        spinner_text: "Assigning users..."
      unassign:
        operation_id: unassignTeamLicenseUser
        description: "Unassign a user from a license"
        confirm: "Unassign user {user_id} from license {license_id}?"
        spinner_text: "Unassigning user..."

  account-tags:
    description: "Manage account tags (account groups)"
    commands:
      list:
        operation_id: fetchAvailableAccountGroups
        description: "List all account tags in a team"
        spinner_text: "Fetching account tags..."
      get:
        operation_id: fetchAccountGroup
        description: "Fetch a single account tag by name"
        spinner_text: "Fetching account tag..."
      create:
        operation_id: createAccountGroup
        description: "Create a new account tag"
        spinner_text: "Creating account tag..."
      update:
        operation_id: updateAccountGroup
        description: "Update an account tag"
        spinner_text: "Updating account tag..."
      delete:
        operation_id: deleteAccountGroup
        description: "Delete an account tag"
        confirm: "Delete account tag {name}?"
        spinner_text: "Deleting account tag..."
      add-accounts:
        operation_id: appendAccountsToGroup
        description: "Add accounts to an account tag"
        spinner_text: "Adding accounts..."
      remove-accounts:
        operation_id: removeAccountsFromGroup
        description: "Remove accounts from an account tag"
        spinner_text: "Removing accounts..."

  custom-fields:
    description: "Manage custom fields (transformations)"
    commands:
      list:
        operation_id: fetchTransformationList
        description: "Fetch custom fields list"
        spinner_text: "Fetching custom fields..."

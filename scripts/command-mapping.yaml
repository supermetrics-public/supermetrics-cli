      list:
        operation_id: listWorkspaces
        description: "List workspaces for a team"
        spinner_text: "Fetching workspaces..."
      get:
        operation_id: getWorkspace
        description: "Get a single workspace by UUID"
        spinner_text: "Fetching workspace..."

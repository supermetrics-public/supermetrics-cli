        operation_id: getTeamApiKey
        description: "Get an API key for a team"
        spinner_text: "Fetching API key..."
      create:
        operation_id: createTeamApiKey
        description: "Create an API key for a team"
        spinner_text: "Creating API key..."
      update:
        operation_id: updateTeamApiKey
        description: "Update an API key for a team"
        spinner_text: "Updating API key..."

  team-licenses:

        operation_id: updateTeamUserRole
        description: "Update a user's role in a team"
        spinner_text: "Updating user role..."
      remove:
        operation_id: removeTeamUser
        description: "Remove a user from a team"
        confirm: "Remove user {user_id} from team {team_id}?"
        spinner_text: "Removing user..."

  team-api-keys:
    description: "Manage API keys for a team"
    commands:
      list:

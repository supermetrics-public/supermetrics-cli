name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Run lint checks, tests, and calculate coverage
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # mise-action caches tool installs, not Go's module and build caches.
      # Restored before the `make` steps, which are what the warm cache speeds up.
      - name: Cache Go modules and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-

      # Installs Go, Python, uv and the dev tools pinned in mise.toml.
      - name: Install toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate code
        run: make generate

      - name: Check lint
        run: make lint

      - name: Run vulnerability check
        run: make vulncheck

      - name: Build
        run: make build

      - name: Run tests
        if: ${{ github.event_name == 'merge_group' || github.event_name == 'push' }}
        run: make test

      - name: Calculate code coverage
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          make test-coverage 2>&1 | tee -a coverage.log
          rc=${PIPESTATUS[0]}

          # Strip ANSI color codes for clean output in GitHub Actions
          sed -i 's/\x1B\[[0-9;]\{1,\}[A-Za-z]//g' coverage.log

          exit ${rc}

      - name: Add coverage comment to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        if: ${{ github.event_name == 'pull_request' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { readFile } = require('node:fs/promises');

            // 1. Retrieve existing bot comments for the PR
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('Code coverage report')
            })

            // 2. Parse coverage percentage from the output
            const coverage = await readFile('coverage.log', 'utf8')
            const totalMatch = coverage.match(/total:.*?(\d+\.\d+)%/)
            const coveragePercent = totalMatch ? parseFloat(totalMatch[1]) : 0

            // 3. Generate traffic light indicator
            let indicator = '🔴'
            if (coveragePercent >= 75) {
              indicator = '🟢'
            } else if (coveragePercent >= 40) {
              indicator = '🟡'
            }

            // 4. Create text-based progress bar using Unicode blocks
            const createProgressBar = (percent) => {
              const totalBlocks = 20
              const filledBlocks = Math.round((percent / 100) * totalBlocks)
              const emptyBlocks = totalBlocks - filledBlocks
              const filled = '█'.repeat(filledBlocks)
              const empty = '░'.repeat(emptyBlocks)
              return `\`${filled}${empty}\``
            }

            const progressBar = createProgressBar(coveragePercent)

            // 5. Prepare format of the comment
            const output = `
            ### Code coverage report

            Total coverage: ${progressBar} **${coveragePercent}%** ${indicator}

            <details><summary>Detailed report</summary>

            \`\`\`
            ${coverage}
            \`\`\`

            </details>`;

            // 6. If we have a comment, update it, otherwise create a new one
            if (botComment) {
              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              })
            } else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              })
            }

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          name: coverage
          path: coverage.out

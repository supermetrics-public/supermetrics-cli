name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.4.0)"
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must match vMAJOR.MINOR.PATCH (e.g. v0.4.0)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Create tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      # Installs Go, Python, uv and the dev tools pinned in mise.toml.
      - name: Install toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate code
        run: make generate

      - name: Run tests
        run: make test

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SUPERMETRICS_OAUTH_CLIENT_ID: ${{ secrets.SUPERMETRICS_OAUTH_CLIENT_ID }}
          SUPERMETRICS_OAUTH_SCOPES: ${{ secrets.SUPERMETRICS_OAUTH_SCOPES }}

      - name: Notify linux-packages repo
        if: success()
        env:
          GH_TOKEN: ${{ secrets.LINUX_PACKAGES_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh api repos/supermetrics-public/linux-packages/dispatches \
            -f event_type=release-published \
            -f "client_payload[tag]=$VERSION"

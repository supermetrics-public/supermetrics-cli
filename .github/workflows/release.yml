name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.4.0)"
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must match vMAJOR.MINOR.PATCH (e.g. v0.4.0)"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Create tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2

      - name: Install tools
        run: make tools

      - name: Generate code
        run: make generate

      - name: Run tests
        run: make test

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8  # v7.2.1
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SUPERMETRICS_OAUTH_CLIENT_ID: ${{ secrets.SUPERMETRICS_OAUTH_CLIENT_ID }}
          SUPERMETRICS_OAUTH_SCOPES: ${{ secrets.SUPERMETRICS_OAUTH_SCOPES }}

      - name: Notify linux-packages repo
        if: success()
        env:
          GH_TOKEN: ${{ secrets.LINUX_PACKAGES_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh api repos/supermetrics-public/linux-packages/dispatches \
            -f event_type=release-published \
            -f "client_payload[tag]=$VERSION"

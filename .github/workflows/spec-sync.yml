name: Sync OpenAPI Spec

on:
  repository_dispatch:
    types: [openapi-spec-updated]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync OpenAPI Spec
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Installs Go, Python, uv and the dev tools pinned in mise.toml.
      - name: Install toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch latest OpenAPI spec
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/supermetrics-public/supermetrics-python-sdk/contents/openapi-spec.yaml \
            --jq '.content' | base64 -d > openapi-spec.yaml

      - name: Regenerate code
        run: make generate

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR
        if: steps.diff.outputs.changed == 'true'
        env:
          # @automation PAT, not GITHUB_TOKEN: opening a PR from within the repo with
          # GITHUB_TOKEN is blocked unless "Allow GitHub Actions to create and approve
          # pull requests" is enabled — which we deliberately leave off on this public
          # repo. A PAT-opened PR also triggers the PR's CI (GITHUB_TOKEN-opened PRs
          # do not).
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          BRANCH="auto/spec-update-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: sync OpenAPI spec from SDK"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: sync OpenAPI spec from SDK" \
            --body "Automated update of \`openapi-spec.yaml\` and regenerated CLI commands." \
            --base main

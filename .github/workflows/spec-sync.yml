name: Sync OpenAPI Spec

on:
  repository_dispatch:
    types: [openapi-spec-updated]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync OpenAPI Spec
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2

      - name: Install tools
        run: make tools

      - name: Fetch latest OpenAPI spec
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/supermetrics-public/supermetrics-python-sdk/contents/openapi-spec.yaml \
            --jq '.content' | base64 -d > openapi-spec.yaml

      - name: Regenerate code
        run: make generate

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="auto/spec-update-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: sync OpenAPI spec from SDK"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: sync OpenAPI spec from SDK" \
            --body "Automated update of \`openapi-spec.yaml\` and regenerated CLI commands." \
            --base main
